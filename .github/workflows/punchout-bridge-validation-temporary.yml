name: Temporary PunchOut bridge validation

on:
  push:
    branches:
      - feat/punch1-single-customer-ariba-punchout

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: All repository tests
        run: node --test tests/*.test.mjs
      - run: npm run test:punchout
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
