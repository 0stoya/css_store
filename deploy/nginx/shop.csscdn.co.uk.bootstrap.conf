# Temporary HTTP-only vhost used to obtain the first TLS certificate.
# Install this file first, issue the certificate with Certbot/webroot, then
# replace it with shop.csscdn.co.uk.conf.

server {
    listen 80;
    listen [::]:80;

    server_name shop.csscdn.co.uk;

    access_log /var/log/nginx/css-shop-access.log;
    error_log /var/log/nginx/css-shop-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/css-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
