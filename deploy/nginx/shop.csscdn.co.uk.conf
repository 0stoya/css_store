# CSS Store production reverse proxy.
# Next.js listens only on 127.0.0.1:3068 via ecosystem.config.cjs.

server {
    listen 80;
    listen [::]:80;

    server_name shop.csscdn.co.uk;

    access_log /var/log/nginx/css-shop-access.log;
    error_log /var/log/nginx/css-shop-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/css-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name shop.csscdn.co.uk;

    ssl_certificate /etc/letsencrypt/live/shop.csscdn.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.csscdn.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/css-shop-access.log;
    error_log /var/log/nginx/css-shop-error.log;

    location / {
        proxy_pass http://127.0.0.1:3068;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
