# Temporary HTTP-only vhost used to obtain or validate the TLS certificate.
# Install this file first if HTTPS is not yet enabled, then replace it with
# store.csscdn.co.uk.conf once the certificate is available.

server {
    listen 80;
    listen [::]:80;

    server_name store.csscdn.co.uk;

    access_log /var/log/nginx/css-shop-access.log;
    error_log /var/log/nginx/css-shop-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/css-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
